[project]
name = "lumifur-controller-flex"
version = "4.2.6"
description = "LumiFur HUB75 / Flexible LED Protogen Controller Firmware"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Stefan Ritchie" },
]
keywords = ["embedded", "esp32", "led-matrix", "platformio", "fastled"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
]

[dependency-groups]
dev = [
    "pip>=26.1.1",
    "platformio>=6.1,<7",
]
test = [
    "pytest>=8",
]

[tool.uv]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
python_files = ["*_test.py", "test_*.py", "*Test.py"]
